<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: #fdfdfd;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .title {
        font-size: 2.6rem;
        font-weight: 700;
        color: #222;
        text-align: center;
        margin-bottom: 1.05rem;
    }

    .result-box {
        background: #fff;
        padding: 0.7rem;
        border-radius: 0.65rem;
        border: 1px solid #ddd;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.04);
        margin-top: 1rem;
        line-height: 1.4;
        text-align: center;
        font-size: 1.05rem;
    }

    .section-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
    }

    .status-green {
        color: green;
        font-weight: bold;
    }

    .status-red {
        color: red;
        font-weight: bold;
    }
</style>

<div class="container mt-4">
    <div class="title">NFT Hunt Series 5 Progress</div>
    <div class="row justify-content-center mb-3">
        <div class="col-md-6">
            <input type="text" class="form-control" id="walletInput" placeholder="Enter your WAX wallet (e.g. yourname.wam)">
        </div>
    </div>
    <div class="row justify-content-center mb-3">
        <div class="col-md-2 text-center">
            <button id="checkBtn" class="btn btn-primary w-100">Check</button>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div id="result" class="result-box">Results will appear here...</div>
        </div>
    </div>
</div>

<!-- ✅ Place script at bottom so DOM is loaded -->
<script>
    let RpcEndpoint = "https://wax-atomic-api.eosphere.io";
    let Collection = "quackingwaxx";
    const excludedTemplateIds = ['882549'];

    async function fetchAllAssets(wallet) {
        const limit = 1000;
        let page = 1;
        let allAssets = [];
        let more = true;

        while (more) {
            const url = `${RpcEndpoint}/atomicassets/v1/assets?owner=${wallet}&collection_name=${Collection}&page=${page}&limit=${limit}&order=desc`;
            const response = await fetch(url);
            const json = await response.json();

            if (!json.success || !json.data.length) break;

            allAssets = allAssets.concat(json.data);
            if (json.data.length < limit) {
                more = false;
            } else {
                page++;
            }
        }

        return allAssets.filter(asset => !excludedTemplateIds.includes(asset.template.template_id));
    }

    async function checkWallet() {
        const wallet = document.getElementById('walletInput').value.trim();
        const resultElement = document.getElementById('result');
        resultElement.innerHTML = "<em>Checking wallet, please wait...</em>";

        if (!wallet) {
            resultElement.innerHTML = "❌ Please enter a WAX wallet address.";
            return;
        }

        try {
            const assets = await fetchAllAssets(wallet);

            let s1to4Counts = {
                legendary: 0,
                mythic: 0,
                superrare: 0,
                epic: 0,
                rare: 0,
                common: 0
            };

            let series5Templates = {
                legendary: new Set(),
                superrare: new Set(),
                epic: new Set(),
                rare: new Set(),
                common: new Set()
            };

            let templateTracker = new Set();

            for (let asset of assets) {
                const templateId = asset.template.template_id;
                if (templateTracker.has(templateId)) continue;
                templateTracker.add(templateId);

                const attrs = asset.template.immutable_data || {};
                const rarityRaw = attrs.rarity || attrs.Rarity || attrs.RARITY || "";
                const rarity = rarityRaw.toLowerCase();
                const schema = asset.schema.schema_name || "";

                if (["series1", "series2", "series3", "series4"].includes(schema)) {
                    if (rarity.includes('legendary')) s1to4Counts.legendary++;
                    else if (rarity.includes('mythic')) s1to4Counts.mythic++;
                    else if (rarity.includes('super')) s1to4Counts.superrare++;
                    else if (rarity.includes('epic')) s1to4Counts.epic++;
                    else if (rarity === 'rare') s1to4Counts.rare++;
                    else if (rarity === 'common') s1to4Counts.common++;
                }

                if (schema === "series5") {
                    if (rarity.includes('legendary')) series5Templates.legendary.add(templateId);
                    else if (rarity.includes('super')) series5Templates.superrare.add(templateId);
                    else if (rarity.includes('epic')) series5Templates.epic.add(templateId);
                    else if (rarity === 'rare') series5Templates.rare.add(templateId);
                    else if (rarity === 'common') series5Templates.common.add(templateId);
                }
            }

            let huntRequirementsMet = 
                (s1to4Counts.legendary + s1to4Counts.mythic) >= 2 &&
                s1to4Counts.superrare >= 2 &&
                s1to4Counts.epic >= 5 &&
                s1to4Counts.rare >= 6 &&
                s1to4Counts.common >= 8;

            let resultHTML = `<div class="section-title">🦆 Series 1–4 Hunt Check</div>`;
            resultHTML += `Legendary/Mythic: ${s1to4Counts.legendary + s1to4Counts.mythic} / 2<br>`;
            resultHTML += `Super-Rare: ${s1to4Counts.superrare} / 2<br>`;
            resultHTML += `Epic: ${s1to4Counts.epic} / 5<br>`;
            resultHTML += `Rare: ${s1to4Counts.rare} / 6<br>`;
            resultHTML += `Common: ${s1to4Counts.common} / 8<br><br>`;

            resultHTML += huntRequirementsMet
                ? `<span class="status-green">✅ You meet the hunt requirements!</span><br><br>`
                : `<span class="status-red">❌ You are missing some NFTs to qualify.</span><br><br>`;

            resultHTML += `<div class="section-title">🦆 Series 5 Progress</div>`;
            resultHTML += `Legendary: ${series5Templates.legendary.size} / 1<br>`;
            resultHTML += `Super-Rare: ${series5Templates.superrare.size} / 1<br>`;
            resultHTML += `Epic: ${series5Templates.epic.size} / 3<br>`;
            resultHTML += `Rare: ${series5Templates.rare.size} / 4<br>`;
            resultHTML += `Common: ${series5Templates.common.size} / 8<br>`;

            resultHTML += `<div class="mt-3 text-muted"><small>⚠️ Some Series 5 NFTs may not yet be released.</small></div>`;

            resultElement.innerHTML = resultHTML;

        } catch (error) {
            console.error(error);
            resultElement.innerHTML = "⚠️ Error fetching wallet data. Please try again later.";
        }
    }

    // ✅ Connect button after DOM is fully loaded
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('checkBtn').addEventListener('click', checkWallet);
    });
</script>
